{% set version = "2.0.0" %}

package:
  name: sphinxcontrib-jsmath
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sphinxcontrib-jsmath/sphinxcontrib_jsmath-{{ version }}.tar.gz
  sha256: 551f780cf9687f9c3c74f0cf9f18aca06e0d6958853453f3803fe4d357c5b924

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    # This is a circular dependency b/c sphinx depends on this package now :-/
    - sphinx >=2
    - python {{ python_min }}
  imports:
    - sphinxcontrib
    - sphinxcontrib.jsmath

about:
  home: http://sphinx-doc.org/
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A sphinx extension which renders display math in HTML via JavaScript

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - ocefpaf
